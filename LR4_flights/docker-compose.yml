services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: flights
    volumes:
      - flights_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d flights"]
      interval: 2s
      timeout: 3s
      retries: 30

  provider1:
    build: .
    command: ["uvicorn", "provider:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      CARRIER: P1
      AVERAGE_MS: '300'
      ERROR_RATE: '0.05'
      SLOW_RATE: '0'
    healthcheck: &provider_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  provider2:
    build: .
    command: ["uvicorn", "provider:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      CARRIER: P2
      AVERAGE_MS: '500'
      ERROR_RATE: '0.05'
      SLOW_RATE: '0'
    healthcheck: *provider_health

  provider3:
    build: .
    command: ["uvicorn", "provider:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      CARRIER: P3
      AVERAGE_MS: '800'
      ERROR_RATE: '0.05'
      SLOW_RATE: '0.10'
    healthcheck: *provider_health

  search:
    build: .
    ports:
      - '8000:8000'
    environment:
      MODE: ${MODE:-sync}
      DATABASE_URL: postgresql+psycopg://lab:lab@db:5432/flights
      SEED_START: '2026-10-01'
      P1_URL: http://provider1:8000
      P2_URL: http://provider2:8000
      P3_URL: http://provider3:8000
    cap_add:
      - SYS_PTRACE
    command: ["sh", "-c", "python seed.py && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"]
    depends_on:
      db:
        condition: service_healthy
      provider1:
        condition: service_healthy
      provider2:
        condition: service_healthy
      provider3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  flights_pgdata:
