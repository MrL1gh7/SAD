services:
  parking:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_PORT: "5000"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
